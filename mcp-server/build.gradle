plugins {
    id "org.springframework.boot" version "3.4.2"
    id "io.spring.dependency-management" version "1.1.7"
    id "java"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.0"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"

    // ✅ Correct Spring AI 1.1.2 MCP server starter for Spring MVC
    implementation "org.springframework.ai:spring-ai-starter-mcp-server-webmvc"

    // Source: https://mvnrepository.com/artifact/org.springframework.ai/spring-ai-mcp-annotations
    implementation 'org.springframework.ai:spring-ai-mcp-annotations'

    // Database dependencies
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    runtimeOnly "com.h2database:h2"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
}


tasks.test {
    useJUnitPlatform()
}