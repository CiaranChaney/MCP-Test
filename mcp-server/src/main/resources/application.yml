server:
  port: 8081

spring:
  application:
    name: mcp-server

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:mcpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # H2 Console Configuration (optional - for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: debug
